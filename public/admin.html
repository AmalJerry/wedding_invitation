<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Photos admin</title>
</head>
<body>
<h1>Photos</h1>
<p>Uploaded photos replace the default ones and are cropped automatically to fit each section.
Hero & Venue: one photo (a new upload replaces it). Gallery & Moments: each upload is added; "Clear" goes back to the default photos.</p>
<form id="f">
  <p><label>Password <input type="password" name="password" required></label></p>
  <p><label>Section
    <select name="section">
      <option value="hero">Hero (main portrait)</option>
      <option value="gallery">Gallery (carousel)</option>
      <option value="moments">Our moments (grid)</option>
      <option value="venue">Venue</option>
    </select></label></p>
  <p><input type="file" name="file" accept="image/*" multiple></p>
  <p><button name="go" value="upload">Upload</button> <button name="go" value="clear">Clear section</button></p>
</form>
<p id="msg"></p>
<pre id="cur"></pre>
<script>
const f = document.getElementById("f"), msg = document.getElementById("msg"), cur = document.getElementById("cur");
const show = (l) => (cur.textContent = "Current uploads:\n" + JSON.stringify(l, null, 2));
fetch("/api/images").then((r) => r.json()).then(show).catch(() => {});

// shrink big phone photos before upload (max 2000px, JPEG)
const shrink = (file) => new Promise((ok) => {
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 2000 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    c.toBlob((b) => ok(b || file), "image/jpeg", 0.85);
  };
  img.onerror = () => ok(file);
  img.src = URL.createObjectURL(file);
});

const send = async (extra) => {
  const d = new FormData();
  d.append("password", f.password.value);
  d.append("section", f.section.value);
  for (const [k, v] of Object.entries(extra)) d.append(k, v);
  const r = await fetch("/api/images", { method: "POST", body: d });
  if (!r.ok) throw new Error(await r.text());
  show(await r.json());
};

f.onsubmit = async (e) => {
  e.preventDefault();
  try {
    if (e.submitter.value === "clear") {
      if (!confirm("Remove uploaded photos from this section?")) return;
      await send({ action: "clear" });
    } else {
      const files = [...f.file.files];
      if (!files.length) return (msg.textContent = "Choose a photo first.");
      for (const [i, file] of files.entries()) {
        msg.textContent = `Uploading ${i + 1} / ${files.length}…`;
        await send({ file: new File([await shrink(file)], "photo.jpg", { type: "image/jpeg" }) });
      }
      f.file.value = "";
    }
    msg.textContent = "Done ✔";
  } catch (err) { msg.textContent = "Error: " + err.message; }
};
</script>
</body>
</html>
